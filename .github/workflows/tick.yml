# Fires the reminder sender.
#
# Vercel's Hobby plan allows one cron run per day, which is no use to an app
# whose whole job is "notify me at 06:45". So the schedule lives here instead,
# where it is free. On Vercel Pro you can delete this file and put the cron back
# in vercel.json:  "crons": [{ "path": "/api/tick", "schedule": "*/15 * * * *" }]
#
# Setup: add a repository variable TICK_URL pointing at your deployment's
# endpoint, e.g. https://your-app.vercel.app/api/tick
# (Settings > Secrets and variables > Actions > Variables)
#
# Caveat worth knowing: GitHub's scheduled runs are best-effort and can arrive
# several minutes late under load. /api/tick sends anchors falling in the next
# 15 minutes, so a badly delayed run can skip one. It is a free cron, and it is
# priced accordingly.

name: tick

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the sender
        env:
          TICK_URL: ${{ vars.TICK_URL }}
        run: |
          if [ -z "$TICK_URL" ]; then
            echo "TICK_URL is not set — skipping. See the comment at the top of this file."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out -w '%{http_code}' "$TICK_URL")
          echo "HTTP $code"
          cat /tmp/out
          echo
          # A 503 just means this deployment has no Redis configured, which is a
          # valid way to run HouseOS. Anything else in the 5xx range is a fault.
          if [ "$code" -ge 500 ] && [ "$code" -ne 503 ]; then exit 1; fi
